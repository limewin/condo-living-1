<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Condo Move-In Planner</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a hash route, then immediately redirects.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var query = l.search ? l.search : '';
      var hash = l.hash ? l.hash : '';
      
      // Redirect to root of the repo with hash
      var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      if (!repoBase.endsWith('/')) repoBase += '/';

      var target = repoBase + (redirectPath ? '#' + redirectPath : '') + query + (redirectPath ? '' : hash);
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to Condo Move-In Planner...</p>
  </body>
</html>
